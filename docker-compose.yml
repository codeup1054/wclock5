services:
  wclock:
    build: .
    image: ${DOCKER_PREFIX:-wclock5}-app
    container_name: ${DOCKER_PREFIX:-wclock5}-app
    ports:
      - "${PORT:-10405}:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
    restart: unless-stopped
    networks:
      - wclock-net
    volumes:
      - ./app.py:/app/app.py
      - ./templates:/app/templates
      - ./static:/app/static
      - ./parsers/invest:/app/parsers/invest
      - ./parsers/mail.ru:/app/parsers/mail.ru
      - ./invest_portfolio.db:/app/invest_portfolio.db
      - ./odintsovo_weather.db:/app/odintsovo_weather.db
      - ./cache:/app/cache
      - ./logs:/app/logs

  weather-parser:
    build: .
    image: ${DOCKER_PREFIX:-wclock5}-parser
    container_name: ${DOCKER_PREFIX:-wclock5}-parser
    command: python parsers/mail.ru/mail_ru_weather_24hours.py
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - wclock-net
    volumes:
      - ./parsers/mail.ru:/app/parsers/mail.ru
      - ./odintsovo_weather.db:/app/odintsovo_weather.db

  invest-parser:
    build: .
    image: ${DOCKER_PREFIX:-wclock5}-inv
    container_name: ${DOCKER_PREFIX:-wclock5}-inv
    command: python parsers/invest/tinkoff_invest_daemon.py
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - wclock-net
    volumes:
      - ./parsers/invest:/app/parsers/invest
      - ./invest_db.py:/app/invest_db.py
      - ./invest_portfolio.db:/app/invest_portfolio.db

  tickers-parser:
    build: .
    image: ${DOCKER_PREFIX:-wclock5}-tickers
    container_name: ${DOCKER_PREFIX:-wclock5}-tickers
    command: python parsers/invest/tracked_tickers_daemon.py
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - wclock-net
    volumes:
      - ./parsers/invest:/app/parsers/invest
      - ./parsers/invest/tracked_tickers.db:/app/parsers/invest/tracked_tickers.db
      - ./parsers/invest/candles.db:/app/parsers/invest/candles.db

networks:
  wclock-net:
    driver: bridge
