<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Верхний левый угол -->
    <polyline points="4 4, 10 4, 10 10" color="#ff0000"></polyline>
    <line x1="4" y1="4" x2="4" y2="10"></line>

    <!-- Верхний правый угол -->
    <polyline points="20 4, 14 4, 14 10"></polyline>
    <line x1="20" y1="4" x2="20" y2="10"></line>

    <!-- Нижний левый угол -->
    <polyline points="4 20, 4 14, 10 14"></polyline>
    <line x1="4" y1="20" x2="10" y2="20"></line>

    <!-- Нижний правый угол -->
    <polyline points="20 20, 14 20, 14 14"></polyline>
    <line x1="20" y1="20" x2="20" y2="14"></line>
</svg>